[tool:pytest]
addopts =
    --cov macrostat --cov-report term-missing
    --verbose
norecursedirs =
    dist
    build
    .tox
testpaths = tests
python_files = *_test.py

[flake8]
max_line_length = 88
extend_ignore = E203, W503
exclude =
    .tox
    build
    dist
    .eggs
    docs/conf.py

[pyscaffold]
version = 4.5
package = macrostat
extensions =
    cirrus
    pre_commit
