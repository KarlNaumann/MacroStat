name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  schedule:
    # Nightly full suite (includes slow-marked tests) on master at 04:00 UTC.
    - cron: "0 4 * * *"

permissions:
  contents: read

jobs:
  build:
    name: build wheel (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history for setuptools_scm)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock

      - name: Install tox
        run: python -m pip install --upgrade pip tox

      - name: Build sdist and wheel
        run: tox -e clean,build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: build
    runs-on: ${{ matrix.os }}
    # Windows legs are advisory pending fixes to torch.compile cache pollution
    # and joblib USERNAME handling (tests/diff/, tests/estimation/lm_test.py).
    # Tracked as Outstanding Issues. Linux legs remain required.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout (full history for setuptools_scm)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force | Out-Null

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock

      - name: Install tox
        run: python -m pip install --upgrade pip tox

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Test via tox against the built wheel
        shell: bash
        run: |
          ENV_NAME="py$(echo "${{ matrix.python-version }}" | tr -d .)"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Nightly: run the full suite (override the env's default "not slow")
            tox --installpkg dist/*.whl -e "${ENV_NAME}" \
              -- -rfEx --durations 10 --color yes --cov-report=xml \
                 -m "slow or not slow"
          else
            # Per-PR / per-push: keep the env default ("not slow")
            tox --installpkg dist/*.whl -e "${ENV_NAME}" \
              -- -rfEx --durations 10 --color yes --cov-report=xml
          fi

      - name: Upload coverage to Coveralls (parallel leg)
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage.xml
          flag-name: ${{ matrix.os }}-py${{ matrix.python-version }}
          parallel: true

  coverage-finish:
    name: finalize Coveralls report
    needs: test
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'schedule' }}
    steps:
      - name: Tell Coveralls all parallel legs are done
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true
